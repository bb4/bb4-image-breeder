plugins {
    alias(bb4Libs.plugins.scala.library)
    alias(bb4Libs.plugins.application)
}

description = 'Image breeder application (deprecated)'
group = 'com.barrybecker4'
version = '3.0-SNAPSHOT'

bb4 {
    archivesBaseName.set('bb4-image-breeder')
    mainClass.set('com.barrybecker4.imagebreeder.ImageBreederApp')
}

dependencies {
    implementation bb4Libs.common
    implementation bb4Libs.ui
    implementation bb4Libs.imageproc
    implementation bb4Libs.optimization
    implementation 'org.scala-lang.modules:scala-parallel-collections_3:1.3.0'
    // jhlabs comes transitively via bb4-imageproc (local lib/ kept for reference only)
}

tasks.named('run', JavaExec).configure {
    jvmArgs '-ea', '-Xms512M', '-Xmx4G'
}
